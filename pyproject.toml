[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation"
version = "1.0.0"
description = "Customer segmentation with K-means: cleaning, scaling, choosing k, and profiling segments."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sean Frazier" }]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]
